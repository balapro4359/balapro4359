[project]
name = "marketing-orchestrator"
version = "0.1.0"
description = "Multi-tenant AI orchestration platform for marketing automation with a swappable agent engine."
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.2.157",
  "python-telegram-bot>=22.0",
  "pyyaml>=6.0",
  "cryptography>=41.0",
  "structlog>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["orchestration", "orchestration.engines", "skills", "tools", "tools.ported",
            "connectors", "connectors.oauth", "connectors.apikey", "channels", "channels.telegram",
            "data", "config"]
